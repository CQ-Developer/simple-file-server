x-deploy: &x-deploy
  restart_policy:
    condition: on-failure
    max_attempts: 5
    delay: 3s
    window: 10s
name: simple-file-server
services:
  postgresql:
    image: postgres:18-alpine
    deploy: *x-deploy
    env_file: .env
    volumes:
      - type: volume
        source: sfs-data
        target: /var/lib/postgresql
  sfs:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    deploy: *x-deploy
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      postgresql:
        condition: service_started
    volumes:
      - type: volume
        source: sfs-data
        target: /home/sfs/.sfs
volumes:
  sfs-data:

server:
  servlet:
    context-path: /sfs
  tomcat:
    max-part-count: 10
    max-http-form-post-size: 10GB
spring:
  application:
    name: simple-file-server
  main:
    keep-alive: true
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 10GB
      file-size-threshold: 5MB
  jackson:
    default-property-inclusion: NON_NULL
  datasource:
    url: jdbc:postgresql://${SFS_DB_HOST}:${SFS_DB_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  sql:
    init:
      schema-locations:
        - classpath:database/schema/sfs.files.sql
        - classpath:database/schema/sfs.users.sql
      data-locations:
        - classpath:database/data/sfs.users.sql
      mode: ALWAYS
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 2GB
sfs:
  path-prefix: ${SFS_PATH_PREFIX:${user.home}/.sfs}